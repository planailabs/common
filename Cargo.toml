[package]
name = "mac-mgmt-common"
version = "0.1.0"
edition = "2024"

[features]
default = []
sentry = ["dep:sentry"]
tracing-init = ["dep:tracing-subscriber", "dep:tracing"]
observability = ["sentry", "tracing-init"]

[dependencies]
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
humantime = "2"
schemars = { version = "1.2.1", features = ["derive"] }
# direct version (not `workspace = true`) so this crate builds standalone when
# consumed as a path/git dependency outside the mac-mgmt workspace (plan-ai-usb);
# spec mirrors the workspace dep + the "tracing" feature.
sentry = { version = "0.47", default-features = false, features = ["reqwest", "panic", "backtrace", "contexts", "debug-images", "tracing"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
toml = "0.8"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
