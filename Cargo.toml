[package]
name = "mac-mgmt-common"
version = "0.1.0"
edition = "2024"

[features]
default = []
sentry = ["dep:sentry"]
tracing-init = ["dep:tracing-subscriber", "dep:tracing"]
# OTLP traces + metrics. Exports only when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = [
  "tracing-init",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]
# Adds the axum server-span + request-duration middleware.
otel-axum = ["otel", "dep:axum", "dep:http", "dep:opentelemetry-http", "dep:tower-http"]
observability = ["sentry", "tracing-init"]

[dependencies]
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
humantime = "2"
schemars = { version = "1.2.1", features = ["derive"] }
# direct version (not `workspace = true`) so this crate builds standalone when
# consumed as a path/git dependency outside the mac-mgmt workspace (plan-ai-usb);
# spec mirrors the workspace dep + the "tracing" feature.
sentry = { version = "0.47", default-features = false, features = ["reqwest", "panic", "backtrace", "contexts", "debug-images", "tracing"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
toml = "0.8"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# OpenTelemetry. The first-party otel crates release in lockstep and must stay
# on the same minor; tracing-opentelemetry runs one ahead (0.33 pairs with 0.32).
# OTLP over HTTP/protobuf with the blocking reqwest client: the batch processors
# export from their own threads, where an async client has no reactor.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "internal-logs"], optional = true }
opentelemetry-http = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
axum = { version = "0.8", default-features = false, features = ["matched-path"], optional = true }
http = { version = "1", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
