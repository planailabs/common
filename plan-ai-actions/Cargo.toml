[package]
name = "plan-ai-actions"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Server-side execution: YAML parsing, jinja rendering, dispatch, durable queue.
engine = ["dep:minijinja", "dep:async-trait", "dep:yaml_serde", "dep:thiserror", "dep:tokio", "dep:tracing", "uuid/v4"]
# Dioxus components: parameter form + live run progress / report viewers.
ui = ["dep:dioxus", "dep:plan-ai-design"]

[dependencies]
# base: template spec + run report types, wasm-compatible
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive", "uuid1", "indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }

# engine (server-only)
minijinja = { version = "2", optional = true }
async-trait = { version = "0.1", optional = true }
yaml_serde = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
tracing = { version = "0.1", optional = true }

# ui (dioxus, wasm-safe)
dioxus = { version = "0.8.0-alpha.0", optional = true }
plan-ai-design = { path = "../memvault/plan-ai-design", optional = true }
